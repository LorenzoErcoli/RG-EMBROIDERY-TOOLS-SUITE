# Builda la suite e la pubblica su GitHub Pages a ogni push.
# Prerequisiti (una volta sola, su GitHub):
#   - Settings → Pages → Source: "GitHub Actions"
#   - Il submodule del design system (RG-DESIGN-SYSTEM) dev'essere un repo PUBBLICO,
#     altrimenti il checkout non riesce a scaricarlo col token di default.
name: Deploy suite su GitHub Pages

on:
  push:
    branches: [master, main]
  workflow_dispatch:      # permette anche l'avvio manuale dalla scheda Actions

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (col submodule del design system)
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Installa dipendenze
        run: npm install
      - name: Test (rete di sicurezza sulle primitive condivise)
        run: npm test
      - name: Build della suite
        run: npm run build
      - name: Prepara Pages
        uses: actions/configure-pages@v4
      - name: Carica il sito statico
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/shell/dist   # output di `npm run build` (vite build della shell)

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pubblica su Pages
        id: deployment
        uses: actions/deploy-pages@v4
