<script>
(() => {
  const root = document.getElementById('pettine-sequenza-v2');
  const plans = JSON.parse(root.querySelector('[data-plans]').textContent);
  const svg = root.querySelector('[data-disegno]');
  const range = root.querySelector('[data-pos]');
  const selector = root.querySelector('[data-caso]');
  const play = root.querySelector('[data-play]');
  const fase = root.querySelector('[data-fase]');
  let timer = null;
  const stop = () => { if (timer) clearInterval(timer); timer = null; play.textContent = 'Riproduci'; };
  function draw() {
    const plan = plans[Number(selector.value)];
    const ops = plan.operazioni, n = Number(range.value);
    const pts = ops.flatMap(o => o.punti);
    const x0 = Math.min(...pts.map(p=>p.x)), x1 = Math.max(...pts.map(p=>p.x));
    const y0 = Math.min(...pts.map(p=>p.y)), y1 = Math.max(...pts.map(p=>p.y));
    const width = Math.max(280, svg.clientWidth), height = 260, margin = 20;
    const scale = Math.min((width - margin*2)/(x1-x0 || 1),180/(y1-y0 || 1));
    const px = x => margin + (width-2*margin-(x1-x0)*scale)/2+(x-x0)*scale;
    const py = y => 35+(y-y0)*scale;
    svg.setAttribute('viewBox',`0 0 ${width} ${height}`);
    const path = ps => ps.map((p,i)=>`${i?'L':'M'}${px(p.x).toFixed(2)},${py(p.y).toFixed(2)}`).join(' ');
    let html = '<title>Macchia da un centimetro collegata al blocco grande</title>';
    for (const o of ops) if(o.tipo==='ricamo') html += `<path d="${path(o.punti)}" fill="none" stroke="var(--border)" stroke-width="1"/>`;
    for(let i=0;i<n;i++) {
      const o=ops[i], travel=o.tipo==='passaggio', active=i===n-1;
      html += `<path d="${path(o.punti)}" fill="none" stroke="var(${travel?'--viz-series-2':'--viz-series-1'})" stroke-width="${active?2.4:1.3}" ${travel?'stroke-dasharray="4 2"':''}/>`;
    }
    const current=n ? ops[n-1].punti.at(-1):ops[0].punti[0];
    html += `<circle cx="${px(current.x)}" cy="${py(current.y)}" r="4" fill="var(--foreground)"/>`;
    const y=240, a=px(x0), b=px(x0+10);
    html += `<path d="M${a},${y-4}V${y+4}M${a},${y}H${b}M${b},${y-4}V${y+4}" fill="none" stroke="var(--foreground)"/><text x="${(a+b)/2}" y="${y-8}" text-anchor="middle" fill="var(--foreground)" font-size="12">10 mm</text>`;
    svg.innerHTML=html;
    range.max=String(ops.length);
    const type=n?ops[n-1].tipo:'inizio';
    fase.textContent=`${n} / ${ops.length} · ${type==='passaggio'?'Impuntura sulla cucitura futura':type==='ricamo'?'Ricama il pettine':type==='taglio'?'Taglio necessario':'Inizio'}`;
    root.querySelector('[data-tagli]').textContent=`${plan.statistiche.tagli} tagli`;
  }
  selector.addEventListener('change',()=>{stop();range.value='0';draw();});
  range.addEventListener('input',()=>{stop();draw();});
  root.querySelector('[data-step]').addEventListener('click',()=>{stop();range.value=String(Math.min(Number(range.max),Number(range.value)+1));draw();});
  play.addEventListener('click',()=>{
    if(timer){stop();return;}
    if(Number(range.value)>=Number(range.max)) range.value='0';
    play.textContent='Pausa';
    timer=setInterval(()=>{range.value=String(Number(range.value)+1);draw();if(Number(range.value)>=Number(range.max))stop();},140);
  });
  new ResizeObserver(draw).observe(svg);
  draw();
})();
</script>
