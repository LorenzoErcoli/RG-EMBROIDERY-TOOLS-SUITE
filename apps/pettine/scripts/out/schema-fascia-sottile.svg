<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="820" viewBox="0 0 1180 820" font-family="Helvetica, Arial, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="24" y="34" font-size="20" font-weight="bold" fill="#222">Dove nascono i tagli che restano: la fascia sottile e la riga di bordo spezzata</text>
  <text x="24" y="56" font-size="13" fill="#555">Ago 5 sul pannello a sei tinte: 90 tagli su 172 sono di questo tipo. I tre riquadri sono lo stesso posto, letto in tre modi.</text>

  <!-- ===================== 1. COSA SUCCEDE OGGI ===================== -->
  <g transform="translate(24,80)">
    <text x="0" y="0" font-size="15" font-weight="bold" fill="#222">1 · Oggi: la riga di bordo si spezza nella gola, e il pezzo di là resta orfano</text>
    <!-- tinta chiara gia' cucita (sotto) -->
    <rect x="0" y="20" width="540" height="230" fill="#f0f0f0"/>
    <!-- la fascia del colore dell'ago: parte alta continua, bordo basso con una gola -->
    <path d="M0,40 L540,40 L540,150 C500,150 470,150 440,168 C410,186 380,196 350,196 C320,196 290,186 260,168 C230,150 200,150 0,150 Z" fill="#fff3c4"/>
    <text x="8" y="36" font-size="11" fill="#7a6b2a">tinta dell'ago (fascia sottile)</text>
    <text x="8" y="242" font-size="11" fill="#777">tinta piu' chiara, gia' cucita: passarci sopra si vede</text>
    <!-- righe cucite (grigio): 12, 13, 14 -->
    <g stroke="#555" stroke-width="2.2" fill="none">
      <path d="M0,70 L540,70"/><path d="M0,96 L540,96"/><path d="M0,122 L540,122"/>
    </g>
    <!-- riga 15: due pezzi, con la gola in mezzo -->
    <g stroke="#555" stroke-width="2.2" fill="none"><path d="M0,146 L235,146"/></g>
    <g stroke="#2a8fd8" stroke-width="2.2" fill="none"><path d="M465,146 L540,146"/></g>
    <!-- denti (verso il muro, in alto) sulle righe cucite -->
    <g stroke="#555" stroke-width="1" opacity="0.7">
      <path d="M20,96 l4,-16 M40,96 l4,-16 M60,96 l4,-16 M80,96 l4,-16 M100,96 l4,-16 M120,96 l4,-16 M140,96 l4,-16 M160,96 l4,-16 M180,96 l4,-16 M200,96 l4,-16 M220,96 l4,-16 M240,96 l4,-16 M260,96 l4,-16 M280,96 l4,-16 M300,96 l4,-16 M320,96 l4,-16 M340,96 l4,-16 M360,96 l4,-16 M380,96 l4,-16 M400,96 l4,-16 M420,96 l4,-16 M440,96 l4,-16 M460,96 l4,-16 M480,96 l4,-16 M500,96 l4,-16 M520,96 l4,-16"/>
      <path d="M20,122 l4,-16 M40,122 l4,-16 M60,122 l4,-16 M80,122 l4,-16 M100,122 l4,-16 M120,122 l4,-16 M140,122 l4,-16 M160,122 l4,-16 M180,122 l4,-16 M200,122 l4,-16 M220,122 l4,-16 M240,122 l4,-16 M260,122 l4,-16 M280,122 l4,-16 M300,122 l4,-16 M320,122 l4,-16 M340,122 l4,-16 M360,122 l4,-16 M380,122 l4,-16 M400,122 l4,-16 M420,122 l4,-16 M440,122 l4,-16 M460,122 l4,-16 M480,122 l4,-16 M500,122 l4,-16 M520,122 l4,-16"/>
      <path d="M20,146 l4,-16 M40,146 l4,-16 M60,146 l4,-16 M80,146 l4,-16 M100,146 l4,-16 M120,146 l4,-16 M140,146 l4,-16 M160,146 l4,-16 M180,146 l4,-16 M200,146 l4,-16 M220,146 l4,-16"/>
    </g>
    <!-- etichette righe -->
    <text x="546" y="74" font-size="10" fill="#555">12</text><text x="546" y="100" font-size="10" fill="#555">13</text><text x="546" y="126" font-size="10" fill="#555">14</text><text x="546" y="150" font-size="10" fill="#2a8fd8">15</text>
    <!-- il filo: finisce il pezzo sinistro di 15 (verde), deve andare al pezzo destro (rosa) -->
    <circle cx="235" cy="146" r="6" fill="#2ecc40"/>
    <circle cx="465" cy="146" r="6" fill="#ff2d95"/>
    <path d="M235,146 L465,146" stroke="#e01b24" stroke-width="2" stroke-dasharray="6 4" fill="none"/>
    <text x="300" y="215" font-size="12" fill="#b3121a" font-weight="bold">la gola: qui la fascia e' troppo stretta per la riga 15</text>
    <!-- spiegazione -->
    <g font-size="12" fill="#333">
      <text x="0" y="272">Fra il verde e il rosa non c'e' strada nascosta:</text>
      <text x="0" y="290">· sopra ci sono le righe 12-14 gia' cucite, coi loro denti: passarci sopra e' vietato;</text>
      <text x="0" y="308">· sotto c'e' la tinta chiara gia' cucita: a vista;</text>
      <text x="0" y="326">· nella gola non c'e' nessuna riga futura che venga a coprire.</text>
      <text x="0" y="350" font-weight="bold">Quindi: rasafilo. E il pezzo destro di 15 e' un orfano da 3 cm.</text>
    </g>
  </g>

  <!-- ===================== 2. LA RIGA DI BORDO SEGUE IL BORDO ===================== -->
  <g transform="translate(610,80)">
    <text x="0" y="0" font-size="15" font-weight="bold" fill="#222">2 · Proposta A (in creazione): la riga di bordo non si spezza, segue il bordo</text>
    <rect x="0" y="20" width="540" height="230" fill="#f0f0f0"/>
    <path d="M0,40 L540,40 L540,150 C500,150 470,150 440,168 C410,186 380,196 350,196 C320,196 290,186 260,168 C230,150 200,150 0,150 Z" fill="#fff3c4"/>
    <g stroke="#555" stroke-width="2.2" fill="none">
      <path d="M0,70 L540,70"/><path d="M0,96 L540,96"/><path d="M0,122 L540,122"/>
    </g>
    <!-- riga 15 continua: nella gola scende lungo il bordo, a mezzo passo dentro -->
    <path d="M0,146 L235,146 C255,146 240,146 262,160 C290,178 320,188 350,188 C380,188 410,178 438,160 C460,146 445,146 465,146 L540,146" stroke="#2a8fd8" stroke-width="2.6" fill="none"/>
    <g stroke="#2a8fd8" stroke-width="1" opacity="0.8">
      <path d="M270,164 l3,-16 M290,174 l3,-16 M310,182 l3,-16 M330,187 l3,-16 M350,188 l3,-16 M370,187 l3,-16 M390,182 l3,-16 M410,174 l3,-16 M430,164 l3,-16"/>
    </g>
    <text x="546" y="150" font-size="10" fill="#2a8fd8">15</text>
    <text x="250" y="215" font-size="12" fill="#1b6fb0" font-weight="bold">una riga sola: nella gola si stringe verso la 14</text>
    <g font-size="12" fill="#333">
      <text x="0" y="272">Dove la fascia si restringe sotto il passo, la riga piu' esterna non si taglia:</text>
      <text x="0" y="290">segue il bordo a mezzo passo dentro, come farebbe una mano. Nella gola la</text>
      <text x="0" y="308">distanza dalla 14 scende sotto i 2 mm: li' la densita' sale un po', per pochi mm.</text>
      <text x="0" y="326">Vale solo per l'ULTIMA riga di una fascia, e solo per gole corte (fino a ~3 cm).</text>
      <text x="0" y="350" font-weight="bold">Niente orfano, niente taglio. E' una decisione tua: nella sfera avevi scelto «si taglia sul bordo».</text>
    </g>
  </g>

  <!-- ===================== 3. LA GOLA SI CUCE IN IMPUNTURA ===================== -->
  <g transform="translate(24,450)">
    <text x="0" y="0" font-size="15" font-weight="bold" fill="#222">3 · Proposta B (in cucitura): nella gola si passa in impuntura, nel colore giusto</text>
    <rect x="0" y="20" width="540" height="230" fill="#f0f0f0"/>
    <path d="M0,40 L540,40 L540,150 C500,150 470,150 440,168 C410,186 380,196 350,196 C320,196 290,186 260,168 C230,150 200,150 0,150 Z" fill="#fff3c4"/>
    <g stroke="#555" stroke-width="2.2" fill="none">
      <path d="M0,70 L540,70"/><path d="M0,96 L540,96"/><path d="M0,122 L540,122"/><path d="M0,146 L235,146"/>
    </g>
    <path d="M465,146 L540,146" stroke="#2a8fd8" stroke-width="2.2" fill="none"/>
    <!-- passaggio in impuntura lungo il bordo della gola -->
    <path d="M235,146 C255,146 240,146 262,160 C290,178 320,188 350,188 C380,188 410,178 438,160 C460,146 445,146 465,146" stroke="#f08a1a" stroke-width="3" fill="none" stroke-dasharray="7 4"/>
    <circle cx="235" cy="146" r="6" fill="#2ecc40"/><circle cx="465" cy="146" r="6" fill="#ff2d95"/>
    <text x="230" y="215" font-size="12" fill="#b25a00" font-weight="bold">impuntura, punti da 3 mm, lungo il bordo della gola</text>
    <g font-size="12" fill="#333">
      <text x="0" y="272">La gola e' tinta dell'ago senza nessuna riga: resterebbe nuda. Un'impuntura di quel</text>
      <text x="0" y="290">colore, li', non passa SOPRA niente e non e' di un colore sbagliato: e' filo giusto in</text>
      <text x="0" y="308">un posto che altrimenti resta vuoto. Oggi la regola la vieta (tinta propria senza</text>
      <text x="0" y="326">righe future = a vista). Se per te un'impuntura cosi' e' accettabile, i 90 tagli di</text>
      <text x="0" y="350" font-weight="bold">questo tipo spariscono senza toccare le righe. Se non lo e', resta la proposta A.</text>
    </g>
  </g>

  <!-- ===================== 4. COME MI MUOVEREI ===================== -->
  <g transform="translate(610,450)">
    <text x="0" y="0" font-size="15" font-weight="bold" fill="#222">4 · Come mi muoverei, in ordine</text>
    <g font-size="12.5" fill="#333">
      <text x="0" y="30" font-weight="bold">① Tu decidi fra A e B guardando questo disegno.</text>
      <text x="16" y="48">B e' un pomeriggio: una regola in piu' nella mappa di cosa e' coperto.</text>
      <text x="16" y="66">A e' due giorni: si tocca la costruzione delle righe, e va misurata la densita'.</text>
      <text x="0" y="96" font-weight="bold">② Si misura sul pannello: tagli, filo a vista, righe fuori ordine (deve restare 0).</text>
      <text x="0" y="126" font-weight="bold">③ Le sei immagini per ago, e un provino in macchina della sola fascia.</text>
      <text x="16" y="144">E' il posto dove la teoria (coperto / a vista) va confermata col filo vero.</text>
      <text x="0" y="174" font-weight="bold">④ Il resto dei tagli (82) sono cambi di gruppo e di colore: quelli sono il prezzo</text>
      <text x="16" y="192">del disegno, e si riducono solo cambiando l'ordine dei gruppi, non delle righe.</text>
    </g>
    <!-- legenda -->
    <g transform="translate(0,230)" font-size="11" fill="#444">
      <line x1="0" y1="0" x2="30" y2="0" stroke="#555" stroke-width="2.2"/><text x="36" y="4">riga gia' cucita</text>
      <line x1="150" y1="0" x2="180" y2="0" stroke="#2a8fd8" stroke-width="2.2"/><text x="186" y="4">riga da fare</text>
      <line x1="290" y1="0" x2="320" y2="0" stroke="#f08a1a" stroke-width="3" stroke-dasharray="7 4"/><text x="326" y="4">impuntura (passaggio)</text>
      <circle cx="10" cy="22" r="5" fill="#2ecc40"/><text x="20" y="26">dove il filo e'</text>
      <circle cx="120" cy="22" r="5" fill="#ff2d95"/><text x="130" y="26">dove deve andare</text>
      <line x1="240" y1="22" x2="270" y2="22" stroke="#e01b24" stroke-width="2" stroke-dasharray="6 4"/><text x="276" y="26">rasafilo</text>
    </g>
  </g>
</svg>
